# Run the test suite on every push and pull request.
#
# The push trigger covers every branch, not just main. Contributors work from
# forks, where `pull_request` runs are hosted by the upstream repository and
# stay queued until a maintainer approves them; a fork branch with no push
# trigger of its own therefore gets no CI signal at all before review. The
# cost of the wider trigger is that a branch pushed inside this repository
# while it has an open pull request is tested twice, once per event.
#
# The matrix is the two ends of the supported range declared in
# pyproject.toml (requires-python = ">=3.9"): 3.9 catches the syntax and
# stdlib-API regressions that a newer interpreter hides, 3.12 catches the
# deprecations 3.9 has not reached yet. The versions in between fail in the
# same ways as one of the two ends.
#
# The checkout leaves out data/ — 348 MB of benchmark trajectories the tests
# never read. Sparse checkout is what removes it: `filter: blob:none` only
# skips historical blobs, and data/ arrived in a single commit, so the current
# commit's copy would still be fetched to populate the working tree. Non-cone
# mode is what makes the `!/data` negation work; actions/checkout applies
# `blob:none` on its own whenever sparse-checkout is set.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A branch that is force-pushed or fixed up in quick succession only needs its
# newest commit tested; the superseded runs are cancelled instead of finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/data
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its test extra
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest tests/ -q
