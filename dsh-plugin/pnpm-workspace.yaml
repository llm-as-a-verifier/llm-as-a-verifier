# The plugin's runtime peers (@deepseek-ai/cordis, dsh-*) are provided by the
# host harness (the profile's hoisted node_modules when installed with
# `dsh plugin --profile web add .`, or the dev-link store when developing
# against a source checkout). Some rc peers were never published to the
# registry (e.g. @deepseek-ai/dsh-type-meta), so pnpm must not try to
# auto-install them here.
autoInstallPeers: false
# In dev-link mode node_modules is a junction to a source checkout store and
# there is no lockfile, so skip pnpm's pre-run dependency-status check.
verifyDepsBeforeRun: false
