# Bundle patch layer exported by this package (package.json `dsh.bundle.patch`).
# A top-level YAML ARRAY of loader patch entries; the `insert` row (no target
# id) appends the plugin entry to the composed entry list of the profile.
# `name: dsh-plugin` resolves from the profile's hoisted node_modules to the
# built `lib/index.js` (main).
- insert:
    - id: llm-verifier-multipath
      name: dsh-plugin
      config:
        nPaths: 3
        pivots: 2
        nEvaluations: 1
        provider: deepseek-official
        model: deepseek-v4-flash
        criteria: Does the candidate solve the task correctly and completely?
        maxCandidateChars: 12000
