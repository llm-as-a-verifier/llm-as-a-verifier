# Publish a GitHub Release for a version tag, with the built artifacts and
# their checksums attached — so a consumer can pin source commit, version,
# and artifact digest without cloning the benchmark trajectories under data/.
#
# Usage:
#   1. Bump `version` in pyproject.toml and merge it.
#   2. git tag v0.2.1 && git push origin v0.2.1
#
# The tag must match the version in pyproject.toml; the job fails otherwise,
# which is what keeps the tag -> version -> artifact chain honest.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/data
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the tag matches pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Checksum the artifacts
        working-directory: dist
        # Keep artifact names from being parsed as checksum options.
        run: sha256sum -- *.whl *.tar.gz | tee SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "v${version}" \
            --generate-notes \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS
